<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0b6b4f">
  <meta name="description" content="Thông tin chi tiết sản phẩm tại Mộc An Pharmacy.">
  <title>Chi tiết sản phẩm | Mộc An Pharmacy</title>
  <link rel="stylesheet" href="/assets/css/styles.css">
  <script type="module" src="/assets/js/product.js"></script>
</head>
<body>
  <a class="skip-link" href="#main-content">Bỏ qua điều hướng</a>
  <div id="site-header"></div>

  <main id="main-content" class="product-page section-shell">
    <nav class="breadcrumbs" aria-label="Đường dẫn">
      <a href="/">Trang chủ</a><span aria-hidden="true">/</span><a href="/#products">Sản phẩm</a><span aria-hidden="true">/</span><span id="breadcrumb-current">Chi tiết</span>
    </nav>

    <div id="product-detail" aria-live="polite" aria-busy="true"></div>
    <div id="product-detail-state"></div>

    <section class="related-products" id="related-section" aria-labelledby="related-title" hidden>
      <div class="section-heading section-heading--compact">
        <div>
          <p class="eyebrow">Có thể bạn quan tâm</p>
          <h2 id="related-title">Sản phẩm cùng danh mục</h2>
        </div>
        <a class="text-link" href="/#products">Xem tất cả <span aria-hidden="true">→</span></a>
      </div>
      <div class="product-grid product-grid--related" id="related-grid"></div>
    </section>
  </main>

  <div id="site-footer"></div>
  <noscript><p class="noscript">Vui lòng bật JavaScript để xem thông tin sản phẩm.</p></noscript>
</body>
</html>
